services:
  # Static Webapp Frontend
  - type: web
    name: tifr-visitor-highlighter
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # Private Python API (Native Linux C++ Poppler + Tesseract - 100% Code Hidden)
  - type: web
    name: tifr-python-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /

